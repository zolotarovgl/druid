# druid's runtime: only what druid and its stage scripts call (druid doctor checks the same list).
# Versions: floors from the CRG phylo env that step 1 + 2 ran on (02/11/2026), not exact pins.
#   conda env create -f environment.yml && conda activate druid && druid doctor
name: druid
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # step 1: search, cluster
  - hmmer>=3.4
  - bedtools>=2.31
  - samtools>=1.21
  - diamond>=2.1.10
  - mcl>=22.282
  # step 2: align, tree, generax, gxsup, possvm
  - mafft>=7.526
  - clipkit>=2.3
  - iqtree>=2.3.6
  - fasttree>=2.1.11
  - generax>=2.0.4
  - openmpi>=4.1
  # python (druid, the vendored treeview, phylogeny/main.py, possvm)
  - ete3>=3.1.3
  - biopython>=1.84
  - pyyaml>=6
  - numpy
  - pandas
  - networkx
  - lxml
  - six
  - pytest              # the test suite (druid/README.md, Tests)
  - pip
  - pip:
      - textual>=8.2,<9
      - rich>=14,<16
      - typer>=0.23
