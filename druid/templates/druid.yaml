# druid project (druid init, {today}). Paths are relative to this directory.
# druid writes only inside this directory; proteomes_dir, pfam_db and hmm_dir are read-only.
outdir: results
runs_dir: runs
nextflow_dir: .
partition: genoa64
qos: normal
prepare: auto            # locked: druid never rebuilds data/input.fasta (druid adopt sets it)
proteomes_dir: /users/asebe/xgraubove/genomes/data   # read-only; files start with the species prefix
proteome_glob: "{{sp}}_long.pep.fasta"
species: []
taxonomy: data/genome_sources.tsv   # species -> clade table of the default source (shipped; copied by druid init)
sources: []                         # custom proteome sources (prepare), beside the default proteomes_dir
# Parameters the step1 and step2 stages read. Values = v3 nextflow.config params + the `precise`
# profile + the last successful step2 run (24/09/2026: -profile slurm,precise --run_generax).
params:
  MAFFT_OPT: "--maxiterate 1000 --localpair"
  TREE_METHOD: iqtree2
  IQTREE2_MODEL: TEST
  SUBS_MODEL: LG
  SPECIES_TREE: data/species_tree.binary.newick
  ORIGIN_TREE: data/species_tree.newick   # orthogroup origin (Dollo MRCA); keeps polytomies (Grygoriy, 11/10/2026)
  MAX_SPR: 3
  NCPU_GENERAX: 2
  REFNAMES: data/Mmus_gene_names.csv
  REFSPECIES: Mmus
  run_generax: true
  gxsup: true
  resources_tsv: resources.tsv          # absent = stage defaults
  min_seqs: 5          # skip HGs with fewer seqs (= nextflow.config params.min_seqs; IQ-TREE needs >= 4 to bootstrap)
  origins: true        # compute orthogroup origins (Dollo MRCA on ORIGIN_TREE)
  min_distinct: 4     # ... and HGs with fewer distinct seqs (= nextflow.config params.min_distinct)
  # step1 (search, cluster): = nextflow.config params + the 24/09/2026 step1 run
  genefam_info: data/families.csv       # the project's families (library: druid/data/families_library.csv); the job reads a copy taken at submit
  infasta: data/input.fasta             # built by prepare (sub-project 2)
  pfam_db: /users/asebe/xgraubove/data/pfam/Pfam-A.hmm
  hmm_dir: null        # optional dir of custom <name>.hmm models (never written: search.sh copies it)
  domain_expand: 30
  s1_ncpu: 4           # search cpus
  s2_ncpu: 4           # cluster cpus
  max_n: 2000          # recluster HGs larger than this
  s2_inflation: 1.1    # MCL inflation
